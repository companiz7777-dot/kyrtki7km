<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Адмін-панель — KURTKI 7KM</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d0d0d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261101a">
  <link rel="stylesheet" href="css/admin.css?v=20261101a">
</head>
<body class="adm">
  <!-- Вхід -->
  <section class="login" id="login" hidden>
    <form class="login__box" id="loginForm">
      <span class="logo">KURTKI<sup>7KM</sup></span>
      <p class="eyebrow">Адмін-панель</p>
      <label class="fld"><span>Пароль</span><input type="password" id="loginPass" autocomplete="current-password" required></label>
      <p class="fld__err" id="loginErr" hidden>Невірний пароль</p>
      <button class="btn btn--ink btn--full">Увійти</button>
      <a class="link mono" href="index.html">← На сайт</a>
    </form>
  </section>

  <!-- Панель -->
  <div class="panel" id="panel" hidden>
    <header class="ahdr">
      <a class="logo" href="index.html" title="Відкрити сайт">KURTKI<sup>7KM</sup></a>
      <nav class="atabs" aria-label="Розділи">
        <a href="#products" data-tab="products">Товари <span class="mono" id="cntProducts"></span></a>
        <a href="#orders" data-tab="orders">Замовлення <span class="abadge" id="cntOrders" hidden></span></a>
        <a href="#settings" data-tab="settings">Налаштування</a>
      </nav>
      <div class="ahdr__right">
        <a class="link mono" href="index.html" target="_blank" rel="noopener">Сайт ↗</a>
        <button class="link mono" id="logout">Вийти</button>
      </div>
    </header>
    <main class="amain" id="amain" tabindex="-1"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js?v=20261101a"></script>
  <script src="js/admin.js?v=20261101a"></script>
</body>
</html>
